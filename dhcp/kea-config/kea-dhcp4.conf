{
    "Dhcp4": {
        "interfaces-config": {
            "interfaces": [ "eth0" ],
            "dhcp-socket-type": "raw"
        },
        "authoritative": true,
        "subnet4": [
            {
                "id": 1,
                "subnet": "172.50.0.0/16",
                "pools": [ { "pool": "172.50.0.100 - 172.50.0.199" } ],
                "option-data": [
                    {
                        "name": "routers",
                        "data": "172.50.0.254"
                    },
                    {
                        "name": "domain-name-servers",
                        "data": "172.50.0.1"
                    }
                ],
                "reservations": [
                    {
                        "hw-address": "1a:1b:1c:1d:1e:1f",
                        "ip-address": "172.50.0.99",
                        "hostname": "fixed-example"
                    }
                ]
            }
        ],
        # And we specify the type of lease database
        "lease-database": {
            "type": "memfile",
            "persist": true,
            "name": "/var/lib/kea/dhcp4.leases"
        },
        "loggers": [
            {
                "name": "kea-dhcp4",
                "output_options": [
                    {
                        "output": "/var/log/kea-debug.log",
                        "maxver": 8,
                        "maxsize": 204800,
                        "flush": true,
                        "pattern": "%d{%j %H:%M:%S.%q} %c %m\n"
                    }
                ],
                "severity": "DEBUG",
                "debuglevel": 99
            }
        ]
    }
}


